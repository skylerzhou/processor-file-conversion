schemaVersion: '1.0'
application:
  name: processor-plot-prep
  description: Prepare a staged file for pennsieve-quick-plot. A MEF 2.0 recording is converted to one NWB file; any other format is copied through unchanged
  type: processor
runtime:
  # Fargate side. Decoding streams, so memory stays flat; the JVM plus pynwb
  # want a few GB of headroom. Raise if a real-size recording says so.
  cpu: 2048
  memory: 8192
  # standard (Fargate) for conversions, lambda for pass-through. The workflow
  # node's computeType is the default; a run may override it with
  # processorConfigs[].executionTarget, which must be one of these.
  computeTypes:
    - standard
    - lambda
parameters:
  # Defaults are non-empty on purpose: a param with an empty default shows up
  # as required in the run form. "all" means no channel filter.
  - name: CHANNELS
    type: string
    required: false
    description: Comma-separated channel names to convert (the one or two the plot needs), or "all" for every channel. A name that matches no file fails the run. Ignored on pass-through
    defaultValue: all
# INPUT_DIR and OUTPUT_DIR come from the runner. OUTPUT_FILENAME is accepted as
# an env var but not declared here: the converted file is named after the
# channels converted (LA01_LA02.nwb) and nobody needs to set it. Nothing here needs credentials.
# Port names double as folder names, so workflow-service only accepts
# ^[A-Za-z0-9][A-Za-z0-9._-]*$ (no spaces). The next stage links to
# plot-input by this exact name.
inputs:
  - name: data-file
    dataType: application/octet-stream
    required: true
    description: Whatever the data-source staged into INPUT_DIR. Either a MEF 2.0 recording (a folder of .mef files, one per channel, flat or one level down) or a file quick-plot reads directly (EDF, CSV, TSV, FCS, ...)
outputs:
  - name: plot-input
    # Keep this type aligned with the pennsieve-quick-plot input and with the
    # processor-post-timeseries input, which also takes one .nwb file.
    dataType: application/octet-stream
    description: Exactly one data file for the next stage. <recording>.nwb when the input was MEF 2.0, otherwise the input copied unchanged

services:
  processor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Which commit of Pennsieve/mef2streamer to build the jar from (default
        # matches the Dockerfile): MEF2STREAMER_REF=<sha> docker-compose build
        MEF2STREAMER_REF: ${MEF2STREAMER_REF:-0e7304775811e5e8b44cc0e71479563f7b272cc0}
    env_file:
      - dev.env
    environment:
      # Convert only these channels, comma-separated. Unset converts everything.
      #   CHANNELS="EEG AD 01-Ref,EEG PT 01-Ref" make run
      CHANNELS: "${CHANNELS:-}"
    volumes:
      - ./data/input:/data/input:ro
      - ./data/output:/data/output
